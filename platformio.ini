; Juego del dinosaurio para el T-Keyboard (ESP32-C3).

[env:T-Keyboard-dino]
platform = espressif32 @ 6.1
board = ttgo-t-oi-plus
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
; Particiones de una sola aplicación, sin OTA (igual que el reloj).
board_build.partitions = partitions_dino.csv
build_type = release
